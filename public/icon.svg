      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
